<text x="765.0" y="583" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">:BurgerkingBurger  (one instance)</text>
<line x1="600" y1="593" x2="930" y2="593" stroke="#c2410c" stroke-width="1.2"/>
<text x="608" y="608" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">BurgerName = Whopper</text>
<text x="608" y="625" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">Bavrages = Cocacola</text>
<text x="608" y="642" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">SubordinateItems = Fries</text>
<path d="M342,565 L598,605" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M342,645 L598,625" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="470" y="614" text-anchor="middle" font-size="11.5" font-style="italic" fill="#c2410c">same reference</text>
<line x1="30" y1="722" x2="64" y2="722" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><text x="74" y="726" font-size="11" fill="#374151">association</text>
<line x1="200" y1="722" x2="234" y2="722" stroke="#374151" stroke-width="2" marker-start="url(#dia)" marker-end="url(#arr)"/><text x="260" y="726" font-size="11" fill="#374151">has-a (aggregation)</text>
<line x1="410" y1="722" x2="444" y2="722" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="454" y="726" font-size="11" fill="#374151">dependency</text>
<text x="30" y="755" font-size="11" fill="#6b7280">Intrinsic (shared) state lives in BurgerkingBurger; extrinsic (per-use) state is passed in through AddOns(). The factory returns the cached Whopper on the second call.</text>
<text x="30" y="772" font-size="11" fill="#6b7280">ProxyBurger is really the Flyweight "context" (it stores extrinsic state and delegates), not a Proxy; Program.cs never uses it.</text>
<text x="30" y="789" font-size="11" fill="#6b7280">The cache key is only burgerName, so a Whopper with Pepsi would wrongly return the Cocacola instance.</text>
</svg>