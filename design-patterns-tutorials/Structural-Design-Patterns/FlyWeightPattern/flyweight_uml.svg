<path d="M880,128 V298" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="888" y="200" text-anchor="start" font-size="11.5" font-style="italic" fill="#374151">«creates»</text>
<path d="M300,147 V240 H530 V330 H558" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="308" y="232" text-anchor="start" font-size="11" font-style="italic" fill="#374151">«uses» AddOns()</text>
