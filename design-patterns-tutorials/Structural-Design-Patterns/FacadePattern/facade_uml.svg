<text x="405" y="595" font-size="12" font-family="Consolas,Menlo,monospace" fill="#1f2937">Id : int; Name : string; Course : string</text>
<text x="405" y="616" font-size="12" font-family="Consolas,Menlo,monospace" fill="#1f2937">Fees : decimal</text>

<text x="35" y="690" font-size="12" font-weight="700" fill="#111827">Enrollment sequence in EducationFacade.EnrollStudent()</text>
<text x="35" y="716" font-size="12" fill="#374151">1. Verify documents → 2. Create student → 3. Collect fees → 4. Get course details → 5. Issue library card → 6. Send email</text>
<text x="35" y="757" font-size="11.5" fill="#6b7280">Dashed arrows show the facade’s direct dependencies on concrete subsystem services; realization arrows show each service implements its interface.</text>
<text x="35" y="776" font-size="11.5" fill="#6b7280">The interfaces exist in the subsystem design, while EducationFacade currently instantiates the concrete service classes directly.</text>
