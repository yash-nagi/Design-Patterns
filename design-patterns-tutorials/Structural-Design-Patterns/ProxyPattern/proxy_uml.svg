<text x="610" y="334" text-anchor="middle" font-size="11" font-style="italic" fill="#c2410c">_realDatabase</text>
<text x="682" y="358" text-anchor="end" font-size="11" font-style="italic" fill="#c2410c">1</text>
<text x="30" y="520" text-anchor="start" font-size="12" font-style="italic" fill="#374151">Inside ProxyDatabase.GetDataForId(id): access control, then cache, then the real database</text>
<rect x="30" y="588" width="150" height="44" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.4"/>
<text x="105.0" y="614.0" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">GetDataForId(id)</text>
<path d="M218,610 L290,574 L362,610 L290,646 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="290" y="614" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">connected?</text>
<path d="M182,610 H216" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M290,646 V672" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="298" y="662" text-anchor="start" font-size="11" font-style="italic" fill="#374151">no</text>
<rect x="160" y="674" width="260" height="40" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.4"/>
<text x="290.0" y="691.0" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">return "Not connected to</text>
<text x="290.0" y="705.0" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">the database."</text>
<path d="M362,610 H446" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="404" y="602" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">yes</text>
<path d="M448,610 L520,574 L592,610 L520,646 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="520" y="614" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">in cache?</text>
<path d="M520,646 V672" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="528" y="662" text-anchor="start" font-size="11" font-style="italic" fill="#374151">yes</text>
<rect x="435" y="674" width="170" height="40" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.4"/>
<text x="520.0" y="698.0" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">return _cache[id]</text>
<path d="M592,610 H644" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="618" y="602" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">no</text>
<rect x="646" y="588" width="170" height="44" rx="6" fill="#f9fafb" stroke="#c2410c" stroke-width="1.4"/>
<text x="731.0" y="607.0" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">_realDatabase.</text>
<text x="731.0" y="621.0" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">GetDataForId(id)</text>
<path d="M818,610 H840" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="842" y="588" width="148" height="44" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.4"/>
<text x="916.0" y="607.0" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">_cache[id] = data;</text>
<text x="916.0" y="621.0" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">return data</text>
<line x1="30" y1="748" x2="64" y2="748" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#tri)"/><text x="74" y="752" font-size="11" fill="#374151">implements (realization)</text>
<line x1="270" y1="748" x2="304" y2="748" stroke="#c2410c" stroke-width="2" marker-start="url(#dia2)" marker-end="url(#arr)"/><text x="330" y="752" font-size="11" fill="#374151">owns (composition)</text>
<line x1="480" y1="748" x2="514" y2="748" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="524" y="752" font-size="11" fill="#374151">dependency</text>
<text x="30" y="780" font-size="11" fill="#6b7280">ProxyDatabase and RealDataBase both implement IDatabase, so they are interchangeable; the proxy adds the login check and cache before delegating.</text>
<text x="30" y="797" font-size="11" fill="#6b7280">Program declares the variable as ProxyDatabase, not IDatabase, because LogIn() and LogOut() exist only on the proxy.</text>
<text x="30" y="814" font-size="11" fill="#6b7280">The proxy creates RealDataBase in its constructor (eager, not lazy), so it also owns it: filled diamond.</text>
</svg>