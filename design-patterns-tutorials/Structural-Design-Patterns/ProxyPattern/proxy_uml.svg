<text x="138" y="366" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">-_cache : Dictionary&lt;int, string&gt;</text>
<text x="138" y="383" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">-_isConnected : bool</text>
<text x="138" y="400" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+ProxyDatabase()</text>
<text x="138" y="417" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+GetDataForId(id : int) : string</text>
