<text x="30" y="762" font-size="11" fill="#6b7280">Bridge: PaymentMode (abstraction) holds a reference to IPaymentGateWay (implementor), so 4 modes x 4 gateways = 16 combinations need only 8 concrete classes.</text>
<text x="30" y="779" font-size="11" fill="#6b7280">Customer picks both with string switches and assigns the gateway through a public field after construction; a constructor parameter would make the bridge safer.</text>
