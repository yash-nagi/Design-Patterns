<text x="408" y="99" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+GetPrice() : decimal</text>
<text x="408" y="116" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+DisplayDetails(indentLevel : int)</text>
<rect x="120" y="300" width="320" height="122" rx="3" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="280.0" y="318" text-anchor="middle" font-size="11" fill="#374151">Leaf</text>
<text x="280.0" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Product</text>
<line x1="120" y1="344" x2="440" y2="344" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="128" y="359" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+Name : string {get; set;}</text>
<text x="128" y="376" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+Price : decimal {get; set;}</text>
<text x="128" y="393" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+GetPrice() : decimal</text>
<text x="128" y="410" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+DisplayDetails(indentLevel : int)</text>
<rect x="570" y="300" width="360" height="156" rx="3" fill="#ffffff" stroke="#c2410c" stroke-width="1.6"/>
<text x="750.0" y="318" text-anchor="middle" font-size="11" fill="#374151">Composite</text>
<text x="750.0" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">ComboPack</text>
<line x1="570" y1="344" x2="930" y2="344" stroke="#c2410c" stroke-width="1.2"/>
<text x="578" y="359" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+Name : string {get; set;}</text>
<text x="578" y="376" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+Items : List&lt;IOrderItem&gt; {get; set;}</text>
