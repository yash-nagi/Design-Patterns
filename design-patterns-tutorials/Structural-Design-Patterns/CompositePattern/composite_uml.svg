<text x="578" y="444" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+DisplayDetails(indentLevel : int)</text>
<path d="M332,86 H398" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="365" y="78" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">uses</text>
<path d="M280,300 V215 H570 V130" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#triA)"/>
<path d="M750,300 V215 H570" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M930,369 H990 V84 H742" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" marker-start="url(#dia)"/>
<text x="982" y="240" text-anchor="end" font-size="11.5" font-style="italic" fill="#374151">items</text>
<text x="982" y="256" text-anchor="end" font-size="11.5" font-style="italic" fill="#374151">0..*</text>
<line x1="30" y1="560" x2="64" y2="560" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#triA)"/><text x="74" y="564" font-size="11" fill="#374151">implements (realization)</text>
<line x1="260" y1="560" x2="294" y2="560" stroke="#374151" stroke-width="2" marker-start="url(#dia)" marker-end="url(#arr)"/><text x="316" y="564" font-size="11" fill="#374151">has-a (aggregation)</text>
<line x1="470" y1="560" x2="504" y2="560" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><text x="514" y="564" font-size="11" fill="#374151">association</text>
<text x="30" y="595" font-size="11" fill="#6b7280">ComboPack holds a list of IOrderItem, and a child can be a Product or another ComboPack. That self-reference is what builds the tree.</text>
<text x="30" y="612" font-size="11" fill="#6b7280">ComboPack.GetPrice() sums GetPrice() of its children; Product.GetPrice() returns its own price. ShoppingCart never checks which kind it has.</text>
</svg>