<text x="38" y="99" font-size="11.5" font-family="Consolas,Menlo,monospace" fill="#1f2937">+CheckOut() {static}</text>
<rect x="400" y="40" width="340" height="88" rx="3" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
