<rect x="560" y="648" width="14" height="14" fill="#f9fafb" stroke="#1d4ed8" stroke-width="1.6"/><text x="580" y="659" font-size="11" fill="#374151">Adapter</text>
<rect x="650" y="648" width="14" height="14" fill="#f9fafb" stroke="#c2410c" stroke-width="1.6"/><text x="670" y="659" font-size="11" fill="#374151">Adaptee</text>
<text x="30" y="690" font-size="11" fill="#6b7280">DataParseAdapter turns XML into JSON, then delegates to JsonParser, which builds the EmployeeData list. JsonParser is created inside ParseData() (a local variable), so this is a dependency, not a field.</text>
<text x="30" y="706" font-size="11" fill="#6b7280">Application depends on the concrete DataParseAdapter; declaring it as IEmployeeParser would make the client depend only on the Target interface.</text>
