<path d="M740,70 V46 H680 V68" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)" marker-start="url(#dia)"/>
<text x="748" y="52" text-anchor="start" font-size="11.5" font-style="italic" fill="#1d4ed8">successor</text>
<path d="M200,330 V290 H610 V143" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#tri)"/>
<path d="M585,330 V290" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M970,330 V290 H610" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="30" y="490" text-anchor="start" font-size="12" font-style="italic" fill="#374151">Runtime: new User(new Chatbot(new SupportExecutive(new TechTeam()))) handling Issue("Migration failed", LEVEL3)</text>
<rect x="30" y="520" width="210" height="70" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
<text x="135.0" y="542" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">:User</text>
<text x="135.0" y="561" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">RaiseIssue(issue)</text>
<text x="135.0" y="577" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">LEVEL3, PENDING</text>
<rect x="305" y="520" width="210" height="70" rx="6" fill="#f9fafb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="410.0" y="542" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">:Chatbot</text>
<text x="410.0" y="561" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">LEVEL1? no -&gt; PENDING</text>
<text x="410.0" y="577" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">passes it on</text>
<rect x="580" y="520" width="210" height="70" rx="6" fill="#f9fafb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="685.0" y="542" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">:SupportExecutive</text>
<text x="685.0" y="561" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">LEVEL2? no -&gt; PENDING</text>
<text x="685.0" y="577" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">passes it on</text>
<rect x="855" y="520" width="210" height="70" rx="6" fill="#f9fafb" stroke="#c2410c" stroke-width="1.5"/>
<text x="960.0" y="542" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">:TechTeam</text>
<text x="960.0" y="561" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">LEVEL3? yes -&gt; RESOLVED</text>
<text x="960.0" y="577" text-anchor="middle" font-size="11" font-family="Consolas,Menlo,monospace" fill="#1f2937">end of chain</text>
<path d="M242,555 H303" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M517,555 H578" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M792,555 H853" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="30" y1="628" x2="64" y2="628" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#tri)"/><text x="74" y="632" font-size="11" fill="#374151">implements (realization)</text>
<line x1="270" y1="628" x2="304" y2="628" stroke="#1d4ed8" stroke-width="2" marker-start="url(#dia)" marker-end="url(#arr)"/><text x="330" y="632" font-size="11" fill="#374151">has-a (aggregation)</text>
<line x1="480" y1="628" x2="514" y2="628" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="524" y="632" font-size="11" fill="#374151">dependency</text>
<text x="30" y="662" font-size="11" fill="#6b7280">Each handler resolves the issue if the priority matches its level; otherwise it sets PENDING and passes it to the next handler held in its Handler field.</text>
<text x="30" y="679" font-size="11" fill="#6b7280">The «successor» loop is the standard Chain of Responsibility notation: Chatbot and SupportExecutive each hold an ICustomerSupportHandler (the next link).</text>
<text x="30" y="696" font-size="11" fill="#6b7280">TechTeam has no successor, so unmatched issues end as FAILED. The sender (User) knows only the first handler, never who finally resolves the issue.</text>
<text x="30" y="713" font-size="11" fill="#6b7280">Program.cs wires the chain by nesting constructors, so order is fixed at construction time.</text>
</svg>