<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Prototype pattern class diagram</title>
  <desc id="description">CreateDatabaseConnection creates and clones DatabaseConnection. DatabaseConnection implements ICloneable of DatabaseConnection and uses a private copy constructor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/>
    </marker>
    <marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #34495e; stroke-width: 2; }
      .head { fill: #e8f1ef; }
      .interface-head { fill: #f2eadc; }
      .title { font: 600 19px sans-serif; fill: #172a32; }
      .stereotype { font: italic 13px sans-serif; fill: #52666d; }
      .member { font: 14px monospace; fill: #263b43; }
      .small-member { font: 12px monospace; fill: #263b43; }
      .relation { fill: none; stroke: #34495e; stroke-width: 2; }
      .label { font: 13px sans-serif; fill: #34495e; }
    </style>
  </defs>

  <rect x="30" y="24" width="900" height="492" rx="8" fill="#f7f8f5"/>
  <text x="480" y="58" text-anchor="middle" class="title">Prototype Pattern: Database Connection Example</text>

  <g>
    <rect class="box" x="60" y="118" width="300" height="128" rx="4"/>
    <rect class="head" x="61" y="119" width="298" height="50"/>
    <text class="stereotype" x="210" y="139" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="title" x="210" y="160" text-anchor="middle">ICloneable&lt;T&gt;</text>
    <line x1="60" y1="170" x2="360" y2="170" stroke="#34495e" stroke-width="1.5"/>
    <text class="member" x="80" y="199">+ Clone(): T</text>
  </g>

  <g>
    <rect class="box" x="530" y="100" width="370" height="300" rx="4"/>
    <rect class="head" x="531" y="101" width="368" height="52"/>
    <text class="stereotype" x="715" y="122" text-anchor="middle">&lt;&lt;Concrete Prototype&gt;&gt;</text>
    <text class="title" x="715" y="145" text-anchor="middle">DatabaseConnection</text>
    <line x1="530" y1="154" x2="900" y2="154" stroke="#34495e" stroke-width="1.5"/>
    <text class="member" x="550" y="180">- connectionString: string</text>
    <text class="member" x="550" y="201">+ Server: string</text>
    <text class="member" x="550" y="222">+ Port: string</text>
    <text class="member" x="550" y="243">+ Database: string</text>
    <text class="member" x="550" y="264">+ username: string</text>
    <text class="member" x="550" y="285">+ password: string</text>
    <text class="member" x="550" y="306">+ SslMode: bool</text>
    <line x1="530" y1="318" x2="900" y2="318" stroke="#34495e" stroke-width="1.5"/>
    <text class="member" x="550" y="343">- DatabaseConnection(other)</text>
    <text class="member" x="550" y="365">+ Clone(): DatabaseConnection</text>
    <text class="member" x="550" y="386">+ GetConnectionString(): string</text>
  </g>

  <g>
    <rect class="box" x="60" y="330" width="430" height="126" rx="4"/>
    <rect class="interface-head" x="61" y="331" width="428" height="49"/>
    <text class="stereotype" x="275" y="351" text-anchor="middle">&lt;&lt;Client&gt;&gt;</text>
    <text class="title" x="275" y="373" text-anchor="middle">CreateDatabaseConnection</text>
    <line x1="60" y1="380" x2="490" y2="380" stroke="#34495e" stroke-width="1.5"/>
    <text class="small-member" x="80" y="411">+ CreateConnection(): List&lt;DatabaseConnection&gt;</text>
  </g>

  <path class="relation" d="M 530 182 L 370 182" stroke-dasharray="6 4" marker-end="url(#triangle)"/>
  <text class="label" x="435" y="172" text-anchor="middle">implements</text>

  <path class="relation" d="M 490 390 C 520 390, 550 430, 650 430 L 650 410" marker-end="url(#arrow)"/>
  <text class="label" x="548" y="420" text-anchor="middle">creates, clones, customizes</text>
</svg>